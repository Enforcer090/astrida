<!DOCTYPE html>
<html>
<head>
<title>Astridah Muziya - NIPA STAR! 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;color:white;text-align:center;background:linear-gradient(270deg,#6a5cff,#ff6ec4,#00d4ff,#7a3cff);background-size:800% 800%;animation:grad 10s infinite ease;overflow-x:hidden;min-height:100vh}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1{font-family:'Fredoka',sans-serif;font-size:3.2em;margin:30px 10px 5px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.badge{background:white;color:#6a3cff;padding:8px 16px;border-radius:30px;font-weight:700;display:inline-block;margin:6px}
/* ONE BIG PHOTO - NOT DIVIDED */
.photo-box{width:95%; max-width:600px; height:80vh; min-height:600px; margin:25px auto; border-radius:25px; border:8px solid white; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.4); animation: zoom 6s infinite ease-in-out}
.photo-box img{width:100%; height:100%; object-fit:cover; display:block}
@keyframes zoom{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.card{max-width:650px;margin:18px auto;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);padding:18px;border-radius:18px}
button{border:none;padding:14px 26px;border-radius:30px;font-weight:700;cursor:pointer;margin:6px;background:white;color:#6a3cff}
.float{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards;z-index:999}
@keyframes up{0%{transform:translateY(0)}100%{transform:translateY(-120vh);opacity:0}}
</style>
</head>
<body>

<h1>Astridah Muziya! 🎉</h1>
<div><span class="badge">🎓 NIPA 2026 ACCEPTED</span><span class="badge">⭐ SUPERSTAR</span></div>

<!-- ONE BIG PHOTO, NOT DIVIDED -->
<div class="photo-box">
  <img src="astridah.jpg" alt="Astridah Muziya">
</div>

<div class="card"><h3 id="type"></h3><p>Tap anywhere for confetti! 🎉</p></div>

<div class="card">
<h3>😊 Make Astridah Smile</h3>
<button onclick="compliment()">💬 Compliment</button>
<button onclick="joke()">😂 Joke</button>
<button onclick="fireworks()">🎆 Fireworks!</button>
<button onclick="balloonParty()">🎈 Balloons</button>
<button onclick="showCert()">🏆 Certificate</button>
<p id="output" style="font-size:1.4em;min-height:40px;margin-top:12px;font-weight:700"></p>
<div id="cert" style="display:none"><h2>🎓 OFFICIAL CERTIFICATE 🎓</h2><h2 style="font-size:2.2em;color:yellow">Astridah Muziya</h2><p>ACCEPTED at NIPA & officially AWESOME!</p><p>From Idris 🙌</p></div>
</div>

<script>
const msg="Astridah!! You did it! NIPA accepted you because you are brilliant, hardworking and unstoppable. This whole page is dancing because you deserve all the happiness!";
let i=0;function type(){if(i<msg.length){document.getElementById("type").innerHTML+=msg.charAt(i);i++;setTimeout(type,32)}}type();
function floatIcon(icon){const el=document.createElement("div");el.className="float";el.innerHTML=icon;el.style.left=Math.random()*100+"vw";el.style.fontSize=(Math.random()*20+25)+"px";el.style.animationDuration=(Math.random()*3+3)+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),6000)}
setInterval(()=>floatIcon(["🎉","🎓","✨","⭐","📚","🎈"][Math.floor(Math.random()*6)]),220);
document.addEventListener("click",()=>{for(let k=0;k<14;k++)setTimeout(()=>floatIcon("🎉"),k*50)});
function compliment(){document.getElementById("output").innerHTML=["You are the smartest! 🧠","Your smile fixes bad days! 😊","NIPA is lucky to have you! 💅","Queen energy! 👑"][Math.floor(Math.random()*4)]}
function joke(){document.getElementById("output").innerHTML="Why ladder at NIPA? High-level courses! 😂"}
function fireworks(){for(let k=0;k<50;k++)setTimeout(()=>floatIcon("🎆"),k*50)}
function balloonParty(){for(let k=0;k<18;k++){setTimeout(()=>{const b=document.createElement("div");b.className="float";b.innerHTML="🎈";b.style.left=Math.random()*90+"vw";b.style.fontSize="50px";document.body.appendChild(b)},k*200)}}
function showCert(){document.getElementById("cert").style.display="block";fireworks()}
</script>
</body>
</html>
